steps:
  # Step 1: SSH into VM and pull the latest code
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        cd /data/pito-platform &&
        git config --global --add safe.directory /data/pito-platform &&
        git checkout $BRANCH_NAME &&
        git pull origin $BRANCH_NAME
        "

  # Step 2: Identify changed folders on the VM
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        cd /data/pito-platform/backend &&
        changed_services=\"\"

        if git diff --name-only HEAD~1 | grep -q '^apps/common/'; then
          changed_services=\"all\"
        else
          for service in api-gateway user-service order-service notification-service billing-service; do
            if git diff --name-only HEAD~1 | grep -q \"backend/apps/\$service/\"; then
              changed_services=\"\$changed_services \$service\"
              echo \"Service changed: \$service\"
            else
              echo \"No changes for service: \$service\"
            fi
          done
        fi
        echo \"\$changed_services\" > /data/pito-platform/backend/changed_services.txt
        "

  # Step 3: SSH into VM and rebuild necessary Docker images
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        cd /data/pito-platform/backend &&
        sudo -u tuan_nguyen bash -c '
          cd /data/pito-platform/backend &&
          yarn
        '
        changed_services=\$(cat changed_services.txt)

        if [ \"\$changed_services\" = \"all\" ]; then
          docker compose build
        else
          for service in \$changed_services; do
            docker compose build \$service
          done
        fi
        "

  # Step 4: SSH into VM and update relevant containers
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        cd /data/pito-platform/backend &&
        changed_services=\$(cat changed_services.txt)

        if [ \"\$changed_services\" = \"all\" ]; then
          docker compose down &&
          docker compose up -d
        else
          for service in \$changed_services; do
            docker compose down \$service &&
            docker compose up -d --no-deps \$service
          done
        fi
        "

  # Step 5: Clean up dangling images to free up space
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "

        docker image prune -f --filter 'dangling=true'
        "

  # Step 6: Notify Slack about the deployment
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        select_webhook_url=$(gcloud secrets versions access latest --secret="SLACK_WEBHOOK_URL")

        if [ -z "$select_webhook_url" ]; then
          echo "Failed to retrieve SLACK_WEBHOOK_URL from Secret Manager."
          exit 1
        fi

        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        changed_services=\$(cat /data/pito-platform/backend/changed_services.txt)
        services_message=\"No service change.\"

        if [ \"\$changed_services\" = \"all\" ]; then
          services_message=\"All services have changed.\"
        else
          services_message=\"Changed services: \$changed_services\"
        fi

        echo \"\$services_message\"

        curl -X POST -H 'Content-Type: application/json' --data '{
          \"text\": \"Deployment of services to ${_VM_INSTANCE_NAME} completed successfully.\"
        }' '$select_webhook_url'
        "

substitutions:
  _BRANCH_NAME: 'develop'
  _VM_INSTANCE_NAME: 'pito-platform-development'
  _ZONE: 'asia-southeast1-c'

options:
  substitution_option: ALLOW_LOOSE
timeout: '3600s'
