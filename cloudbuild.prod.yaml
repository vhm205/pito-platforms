steps:
  # Step 1: Verify the repository is cloned correctly
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd /workspace

        echo "Service Account used by Cloud Build:"
        gcloud config get-value account

        git config --global credential.helper 'store'

        github_token=$(gcloud secrets versions access latest --secret="GITHUB_TOKEN")
        echo "https://$github_token@github.com" > ~/.git-credentials

        git fetch origin ${_BRANCH_NAME} --unshallow

        echo "Listing contents of /workspace:"
        ls -la /workspace

  # Step 2: Identify changed folders
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd /workspace/backend &&
        changed_services=""

        if git diff --name-only HEAD~1 | grep -q 'backend/libs/common/'; then
          changed_services="all"
        else
          for service in api-gateway order-service notification-service review-service menu-service user-service; do
            if git diff --name-only HEAD~1 | grep -q "backend/apps/${service}"; then
              changed_services="${changed_services} ${service}"
              echo "Service changed: ${service}"
            else
              echo "No changes for service: ${service}"
            fi
          done
        fi
        echo "${changed_services}" > /workspace/backend/changed_services.txt

  # Step 3: Set up buildx
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name mybuilder
        docker buildx inspect --bootstrap

  # Step 4: Build Docker images and push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd /workspace/backend &&
        changed_services=$(cat changed_services.txt)

        shared_cache="${_IMAGE_ZONE}.pkg.dev/${_PROJECT_ID}/pito-platform/shared-cache:${_IMAGE_TAG}"

        services=${changed_services}

        if [ "${changed_services}" = "all" ]; then
          services=("api-gateway" "order-service" "notification-service" "review-service" "menu-service" "user-service")
        else
          IFS=' ' read -r -a services <<< "${changed_services}"
        fi

        echo "Changed services: ${services[@]}"

        first_service=true

        for service in "${services[@]}"; do
          image_url="${_IMAGE_ZONE}.pkg.dev/${_PROJECT_ID}/pito-platform/${service}:${_IMAGE_TAG}"

          echo "Build image for service $service -> $image_url"

          if [ "$first_service" = true ]; then
            docker buildx build \
              --platform linux/amd64 \
              --output type=docker \
              --cache-from=type=registry,ref=$shared_cache \
              --cache-to=type=registry,ref=$shared_cache,mode=max \
              -t $image_url -f ./apps/${service}/Dockerfile .
            
            first_service=false
          else
            docker buildx build \
              --platform linux/amd64 \
              --output type=docker \
              --cache-from=type=registry,ref=$shared_cache \
              -t $image_url -f ./apps/${service}/Dockerfile .
          fi
          
          docker push $image_url
        done

  # Step 5: Copy changed_services.txt to VM
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute scp /workspace/backend/changed_services.txt ${_VM_INSTANCE_NAME}:/data/pito-platform/changed_services.txt --zone ${_ZONE}

  # Step 6: SSH into VM and update relevant containers
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        gcloud auth configure-docker asia-southeast1-docker.pkg.dev &&
        cd /data/pito-platform &&
        echo \"Listing contents of /data/pito-platform:\" &&
        ls -la /data/pito-platform &&

        changed_services=\$(cat changed_services.txt)
        echo \"changed_services: \${changed_services}\"

        if [ \"\$changed_services\" = \"all\" ]; then
          for service in api-gateway order-service notification-service review-service menu-service user-service; do
            docker compose pull \$service
            if [ \"$(docker ps -aq -f name=\${service})\" ]; then
              docker compose down \$service
            else
              echo \"No container \${service} to stop.\"
            fi
            docker compose up -d --no-deps \$service
          done
        else
          for service in \$changed_services; do
            docker compose pull \$service
            if [ \"$(docker ps -aq -f name=\${service})\" ]; then
              docker compose down \$service
            else
              echo \"No container \${service} to stop.\"
            fi
            docker compose up -d --no-deps \$service
          done
        fi
        "

  # Step 7: Clean up dangling images to free up space
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        docker image prune -f --filter 'dangling=true'
        "

  # Step 8: Notify Slack about the deployment
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        select_webhook_url=$(gcloud secrets versions access latest --secret="SLACK_WEBHOOK_URL")

        if [ -z "$select_webhook_url" ]; then
          echo "Failed to retrieve SLACK_WEBHOOK_URL from Secret Manager."
          exit 1
        fi

        gcloud compute ssh ${_VM_INSTANCE_NAME} --zone ${_ZONE} --command "
        changed_services=\$(cat /data/pito-platform/backend/changed_services.txt)
        services_message=\"No service change.\"

        if [ \"\$changed_services\" = \"all\" ]; then
          services_message=\"All services have changed.\"
        else
          services_message=\"Changed services: \$changed_services\"
        fi

        echo \"\$services_message\"

        curl -X POST -H 'Content-Type: application/json' --data '{
          \"text\": \"[Production] Deployment of services to ${_VM_INSTANCE_NAME} completed successfully.\"
        }' '$select_webhook_url'
        "

substitutions:
  _BRANCH_NAME: 'main'
  _VM_INSTANCE_NAME: 'pito-platform-production'
  _ZONE: 'asia-southeast1-a'
  _PROJECT_ID: 'pito-platform-418503'
  _IMAGE_TAG: 'prod'
  _IMAGE_ZONE: 'asia-southeast1-docker'

options:
  substitution_option: ALLOW_LOOSE

timeout: '1200s'

source:
  repoSource:
    projectId: pito-platform-418503
    repoName: pitovn/pito-platform
    branchName: main
