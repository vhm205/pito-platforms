version: '3.8'
services:
  api-gateway:
    build:
      context: ./
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - ./apps/api-gateway/.env
    ports:
      - '3000:3000'
    networks:
      - platform_net

  user-service:
    build:
      context: ./
      dockerfile: ./apps/user-service/Dockerfile
    container_name: user-service
    env_file:
      - .env
    ports:
      - '5003:5003'
    networks:
      - platform_net

  order-service:
    build:
      context: ./
      dockerfile: ./apps/order-service/Dockerfile
    container_name: order-service
    env_file:
      - .env
    ports:
      - '5001:5001'
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge
