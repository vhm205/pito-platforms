syntax = "proto3";

package occasion.event;

message OccasionEvent {
  int32 id = 1;
  string name = 2;
  int32 index = 3;
  bool is_active = 4;
}

message CreateOccasionEventRequest {
  string name = 1;
}

message CreateOccasionEventResponse {
  int32 id = 1;
}

message GetOccasionEventRequest {
  int32 id = 1;
}

message GetOccasionEventResponse {
  OccasionEvent occasion_event = 1;
}

message UpdateOccasionEventRequest {
  int32 id = 1;
  optional string name = 2;
  optional bool is_active = 3;
}

message UpdateOccasionEventResponse {
  int32 affected_rows = 1;
}

message DeleteOccasionEventRequest {
  int32 id = 1;
}

message DeleteOccasionEventResponse {
  bool success = 1;
}