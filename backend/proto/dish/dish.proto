syntax = "proto3";

package dish;

message PaginationRequest {
  int32 current_page = 1;
  int32 page_size = 2;
}

message FilterRule {
  string column = 1;
  string operator = 2;
  string value = 3;
}

message SortRule {
  string column = 1;
  string direction = 2;
}

// Dish message definition
message Dish {
  string id = 1;
  string name = 2;
  int32 quantity = 3;
  string quantity_unit = 4;
  repeated string images = 5;
  string store_id = 6;
  string partner_id = 7;
  int32 package_option_id = 8;
}

// CreateDishRequest for creating a new dish
message CreateDishRequest {
  string name = 1;
  optional int32 quantity = 2;
  optional string quantity_unit = 3;
  repeated string images = 4;
  string store_id = 5;
  string partner_id = 6;
  optional int32 package_option_id = 7;
}

// CreateDishResponse for returning the created dish
message CreateDishResponse {
  string id = 1;
}

// GetDishRequest for retrieving a single dish by ID
message GetDishRequest {
  string id = 1;
}

// GetDishResponse for returning a single dish
message GetDishResponse {
  Dish dish = 1;
}

// ListDishesRequest for retrieving a list of dishes with pagination and filtering
message ListDishesRequest {
  PaginationRequest pagination = 1;
  repeated SortRule sorts = 2;
  repeated FilterRule filters = 3;
}

// ListDishesResponse for returning a list of dishes with pagination metadata
message ListDishesResponse {
  repeated Dish dishes = 1;
  int32 total_count = 2;
}

// UpdateDishRequest for updating an existing dish
message UpdateDishRequest {
  string id = 1;
  optional string name = 2;
  optional int32 quantity = 3;
  optional string quantity_unit = 4;
  repeated string images = 5;
  optional string store_id = 6;
  optional string partner_id = 7;
  optional int32 package_option_id = 8;
}

// UpdateDishResponse for returning the updated dish
message UpdateDishResponse {
  int32 affected_rows = 1;
}

// DeleteDishRequest for deleting a dish by ID
message DeleteDishRequest {
  string id = 1;
}

// DeleteDishResponse for confirming deletion
message DeleteDishResponse {
  bool success = 1;
}