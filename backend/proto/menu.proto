  string id = 1;
  optional  string name = 2;
  optional  string status = 3;
  optional int32 serviceFeeRate = 4;
  optional common.BusinessType businessType = 5;
  optional common.Certification certification = 6;
  BankAccountInfo bankAccount = 7;
  BusinessInfo businessInfo = 8;
  BusinessOwner businessOwner = 9;
