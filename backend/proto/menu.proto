// [START] UPDATE STORE
////////////////////////

message UpdateStoreRequest {
  message StoreContactInfo {
    string email = 1;
    string phone = 2;
    string full_name = 3;
  }

  message StoreLocation {
    string ward = 1;
    string region = 2;
    string address = 3;
    string district = 4;
    double latitude = 5;
    double longitude = 6;
  }

  message StoreBankAccount {
    string bank_name = 1;
    string bank_branch = 2;
    string account_holder = 3;
    string account_number = 4;
  }

  message StoreImage {
    string cover = 1;
    string avatar = 2;
    string thumbnail = 3;
  }

  message SectionInterval {
    string open = 1;
    string close = 2;
  }

  message PrepTime {
    bool is_active = 1;
    repeated SectionInterval section_intervals = 2;
  }

  message PrepTimes {
    PrepTime monday = 1;
    PrepTime tuesday = 2;
    PrepTime wednesday = 3;
    PrepTime thursday = 4;
    PrepTime friday = 5;
    PrepTime saturday = 6;
    PrepTime sunday = 7;
  }

  message Metadata {
    string store_slug = 1;
    string region_slug = 2;
  }

  string id = 1;
  optional string store_name = 2;
  optional StoreImage images = 3;
  optional bool is_vat = 4;
  optional string description = 5;
  repeated StoreContactInfo contacts = 6;
  optional StoreLocation location = 7;
  optional StoreBankAccount bank_account = 8;
  optional int32 engagement_level = 9;
  optional int32 performance_level = 10;
  Metadata metadata = 11;
}

message UpdateStoreResponse {
  int32 affected_rows = 1;
}

// [END] UPDATE STORE

