syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";

service OrdersService {
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderResponse);
  rpc UpdateStoreOrderStatus(UpdateStoreOrderStatusRequest) returns (UpdateStoreOrderResponse);
  rpc FindOrder (FindOrderRequest) returns (FindOrderResponse);
  rpc FindStoreOrder (FindStoreOrderRequest) returns (FindStoreOrderResponse);
  rpc FindOrders (OrderFilterDto) returns (Orders);
  rpc FindOrdersWithPagination (QueryOrderWithPagination) returns (OrderWithPagination);
}

// Request message for UpdateOrderStatus
message UpdateOrderStatusRequest {
  string id = 1;
  string status = 2;
  oneof extra_fields {
    string cancel_reason = 3;
    google.protobuf.Timestamp timestamp = 4;
    int32 delivery_eta = 5;
  }
}
message UpdateOrderResponse {
  Order order = 1;
}

// Request message for UpdateStoreOrderStatus
message UpdateStoreOrderStatusRequest {
  string id = 1;
  string status = 2;
}
message UpdateStoreOrderResponse {
  string id = 1;
  string status = 2;
}

// Request message for FindOrder
message FindOrderRequest {
  oneof filter {
    string id = 1;
    string order_code = 2;
    string status = 3; 
  }
}
message FindOrderResponse {
  Order order = 1;
}


// Request message for FindStoreOrder
message FindStoreOrderRequest {
  oneof filter {
    string id = 1;
    string order_code = 2;
    string order_id = 3;
    string status = 4; 
  }
}
message FindStoreOrderResponse {
  StoreOrder store_order = 1;
}

message OrderFilterDto {
  string user_id = 1;
  string keyword = 2;
  string status = 3;
  string from_date = 4;
  string to_date = 5;
  string delivery_date = 6;
  string sort_by = 7;
  string sort_direction = 8;
  string page_size = 9;
  string from = 10;
}

// Message for Order Items
message OrderItem {
  string item_id = 1;
  string item_name = 2;
  string item_slug = 3;
  float price = 4;
  int32 quantity = 5;
  float total_price = 6;
  string notes = 7;
  repeated string raw_options_choices = 8;

  message Item {
    string id = 1;
    string name = 2;
    string slug = 3;
    int32 index = 4;
    repeated string images = 5;
    string store_id = 6;
    bool is_active = 7;
    string unit_type = 8;
    float base_price = 9;
    string created_at = 10;
    string deleted_at = 11;
    string fts_vector = 12;
    string updated_at = 13;
    string description = 14;
    bool setup_party = 15;
    int32 max_quantity = 16;
    int32 min_quantity = 17;
    string special_note = 18;
    repeated int32 cuisine_types = 19;
    repeated int32 service_types = 20;
    int32 unit_quantity = 21;
    string eating_utensil = 22;
    string packaging_type = 23;
    repeated string occasion_events = 24;
    string menu_category_id = 25;
    int32 preparation_time = 26;
    bool server_available = 27;
    string extra_description = 28;
    repeated int32 special_dietaries = 29;
    string options_and_choices = 30;
  }

  Item item = 9;
}

// Message for Order
message Order {
  string id = 1;
  string order_code = 2;
  float total_price = 3;
  string status = 4;
  string payment_method = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp delivery_date = 7;
}

// Message for Store Order
message StoreOrder {
  string id = 1;
  string status = 2;
}

message Orders {
  repeated Order orders = 1;
  int32 total = 2;
}

// Enum for sorting direction
enum SortDirection {
  ASC = 0;
  DESC = 1;
}

// GetOrderRequest with pagination
message QueryOrderWithPagination {
  int32 page = 1;        // Page number for pagination
  int32 page_size = 2;   // Number of items per page

  // Filtering criteria
  message OrderFilter {
    optional string status = 1;
    optional string keyword = 2;
    optional string from_date = 3;
    optional string to_date = 4;
  }

  // Sorting criteria
  message OrderSort {
    string field = 1;
    SortDirection direction = 2;
  }

  OrderFilter filters = 3; // List of filters for querying orders
  repeated OrderSort sorts = 4;     // List of sorting criteria
}

message OrderWithPagination {
  repeated Order orders = 1;
  int32 total = 2;
}
