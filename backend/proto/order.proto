// Request message for UpdateOrderStatus
message UpdateOrderStatusRequest {
  string id = 1;
  common.OrderStatus status = 2;
  oneof extra_fields {
    string cancel_reason = 3;
    google.protobuf.Timestamp timestamp = 4;
    int32 delivery_eta = 5;
  }
}
message UpdateOrderResponse {
  Order order = 1;
}

// Request message for UpdateStoreOrderStatus
message UpdateStoreOrderStatusRequest {
  oneof identifier {
    string id = 1;
    string order_id = 2;
  }
  common.OrderStatus status = 3;
}
message UpdateStoreOrderResponse {
  string id = 1;
  string status = 2;
}

// Request message for FindOrder
message FindOrderRequest {
  oneof filter {
    string id = 1;
    string order_code = 2;
    string status = 3;
  }
}
message FindOrderResponse {
  Order order = 1;
}

// Request message for FindStoreOrder
message FindStoreOrderRequest {
  oneof filter {
    string id = 1;
    string order_code = 2;
    string order_id = 3;
    string status = 4;
  }
}
message FindStoreOrderResponse {
  StoreOrder store_order = 1;
}

message FindStoreOrdersRequest {
  common.PaginationRequest pagination = 1;
  repeated common.SortRule sorts = 2;
  repeated common.FilterRule filters = 3;
}

message FindStoreOrdersResponse {
  repeated StoreOrder orders = 1;
  int32 total_count = 2;
}

