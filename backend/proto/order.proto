// Message for Order Items
message OrderItemChoice {
  string name = 1;         // Name of the choice
  string choice_id = 2;     // Unique ID of the choice
  double base_price = 3;    // Base price of the choice
  int32 quantity = 4;    // Quantity of the choice
}

message OrderItemOptionAndChoice {
  string option_id = 1;           // Unique ID of the option
  string name = 2;               // Name of the option
  repeated OrderItemChoice choices = 3; // List of choices
  string description = 4;        // Description of the option
}

message OrderItem {
  float price = 1;
  int32 quantity = 2;
  float total_price = 3;
  optional string notes = 4;

  message Item {
    string id = 1;
    string name = 2;
    string slug = 3;
    repeated string images = 4;
    float base_price = 5;
    int32 unit_quantity = 6;

    message OptionsAndChoices {
      string option_id = 1;
      string name = 2;
      message Choice {
        string choice_id = 1;
        string name = 2;
        float base_price = 3;
      }
      repeated Choice choices = 3;
    }
    repeated OptionsAndChoices options_and_choices = 7;
  }

  Item item = 5;

  message RawOptionsChoices {
    string option_id = 1;
    message Choice {
      int32 quantity = 1;
      string choice_id = 2;
    }
    repeated Choice choices = 2;
  }

  repeated RawOptionsChoices raw_options_choices = 6;
}

// Message for Order
message Order {
  string id = 1;
  string store_id = 2;
  string user_id = 3;
  common.OrderType order_type = 4;
  string order_code = 5;

  // Price-related fields
  double total_price = 6;
  double sub_total_price = 7;
  double shipping_fee = 8;
  double discount_amount = 9;
  double discount_shipping_fee = 10;

  // Payment method
  common.PaymentMethod payment_method = 11;

  // Status and dates
  // common.OrderStatus status = 12;
  int32 status_code = 12;
  int32 operator_status_code = 13;
  google.protobuf.Timestamp delivery_at = 14;
  google.protobuf.Timestamp delivery_failed_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  google.protobuf.Timestamp cancelled_at = 17;
  google.protobuf.Timestamp prepared_at = 18;
  google.protobuf.Timestamp confirmed_at = 19;

  // Delivery-related information
  string receiver_name = 20;
  string receiver_phone = 21;
  string delivery_address = 22;
  int32 delivery_eta = 23;
  optional string tracking_url = 24;
  google.protobuf.Timestamp delivery_date = 25;

  // Cancellation and additional details
  optional string cancel_reason = 26;
  bool delivery_later = 27;
  optional string note = 28;
  repeated OrderItem order_items = 29;
  google.protobuf.Struct vat_info = 30;
  int32 error_code = 31;
  google.protobuf.Struct metadata = 32;
  string receiver_email = 33;

  // Timestamps
  google.protobuf.Timestamp created_at = 35;
  google.protobuf.Timestamp updated_at = 36;
  google.protobuf.Timestamp preparing_at = 37;

  bool canceled_by_user = 38;

  int32 refund_status = 39;
  google.protobuf.Timestamp refunded_at = 40;
}

// Message for Store Order
message StoreOrder {
  string id = 1;
  string store_id = 2;
  string order_id = 3;
  string status = 4;
  int32 status_code = 5;
  string order_code = 6;
  float total_price = 7;

  message InvoiceRequest  {
    string email = 1;
    string address = 2;
    string tax_code = 3;
    string company_name = 4;
  }
  optional InvoiceRequest invoice_request = 8;

  message StoreOrderMeta {
    optional string invoice_url = 1;
  }
  optional StoreOrderMeta metadata = 9;
  int32 invoice_status = 10;
  int32 payment_status = 11;

  google.protobuf.Timestamp delivery_date = 12;
}

message Orders {
  repeated Order orders = 1;
  int32 total = 2;
}

// GetOrderRequest with pagination
message FindOrdersRequest {
  common.PaginationRequest pagination = 1;
  repeated common.SortRule sorts = 2;

  // Filtering criteria
  // message OrderFilter {
  //   optional string status = 1;
  //   optional string user_id = 2;
  //   optional string order_code = 3;
  //   optional string from_date = 4;
  //   optional string to_date = 5;
  //   optional string store_id = 6;
  // }

  repeated common.FilterRule filters = 3;
}

message FindOrdersResponse {
  repeated Order orders = 1;
  int32 total_count = 2;
}

message FindTransactionsRequest {
  common.PaginationRequest pagination = 1;
  repeated common.SortRule sorts = 2;
  repeated common.FilterRule filters = 3;
}

message FindTransactionsResponse {
  message Transaction {
    string id = 1;
    string order_id = 2;
    float amount = 3;
    string bill_code = 4;
    string transaction_code = 5;
    string bank_account_name = 6;
    string bank_account_number = 7;
    google.protobuf.Timestamp created_at = 8;
  }

  repeated Transaction transactions = 1;
  int32 total_count = 2;
}

message GetRevenueAndCountOrderByStoreIdsRequest {
  repeated string ids = 1;
}

message GetRevenueAndCountOrderByStoreIdsResponse {
  message StoreRevenueAndCount {
    string store_id = 1;
    int32 total_orders = 2;
    float total_revenue = 3;
  }
  repeated StoreRevenueAndCount store_revenue_and_count = 1;
}

message GetTotalOrderCountByStoreIdRequest {
  string store_id = 1;
}

message GetTotalOrderCountByStoreIdResponse {
  int32 total_order_count = 1;
}