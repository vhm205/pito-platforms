syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "common.proto";

service OrdersService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderResponse);
  rpc UpdateStoreOrderStatus(UpdateStoreOrderStatusRequest) returns (UpdateStoreOrderResponse);
  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
  rpc FindOrder (FindOrderRequest) returns (FindOrderResponse);
  rpc FindOrders (FindOrdersRequest) returns (FindOrdersResponse);
  rpc FindStoreOrder (FindStoreOrderRequest) returns (FindStoreOrderResponse);
  rpc FindStoreOrders (FindStoreOrdersRequest) returns (FindStoreOrdersResponse);
  rpc FindTransactions (FindTransactionsRequest) returns (FindTransactionsResponse);
  rpc GetRevenueAndCountOrderByStoreIds (GetRevenueAndCountOrderByStoreIdsRequest) returns (GetRevenueAndCountOrderByStoreIdsResponse);
  rpc GetTotalOrderCountByStoreId (GetTotalOrderCountByStoreIdRequest) returns (GetTotalOrderCountByStoreIdResponse);
}

// Request message for create order
message CreateOrderRequest {
  message VatInfo {
    string name = 1;
    string tax_code = 2;
    string email = 3;
    string address = 4;
    bool is_default = 5;
  }

  message AddressDetail {
    string name = 1;
    string building = 2;
    string company_name = 3;
    string number_of_apartment = 4;
    string latitude = 5;
    string longitude = 6;
  }

  string session_id = 1;
  repeated string voucher_ids = 2;
  optional string note = 3;
  string receiver_name = 4;
  string receiver_phone = 5;
  string delivery_address = 6;
  string delivery_date = 7;
  bool delivery_later = 8;
  string payment_method = 9;
  string order_type = 10;
  string vnpay_callback_url = 11;
  string bank_code = 12;
  VatInfo vat_info = 13;
  AddressDetail address_detail = 14;
  string user_id = 15;
  string receiver_email = 16;
  string ip_addr = 17;
  string introducer_name = 18;
  int32 version = 19;
}

message CreateOrderResponse {
  message PaymentData {
    optional string qr_code = 1;
    optional string payment_url = 2;
    string state = 3;
  }
  string order_code = 1;
  string order_id = 2;
  int64 total_price = 3;
  string tx_code = 4;
  string tx_id = 5;
  PaymentData payment_data = 6;
}

message UpdateOrderRequest {
  // message OperatorNoteEntry {
  //   string description = 1;      // The note of the operation
  //   string timestamp = 2; // String format of the timestampz
