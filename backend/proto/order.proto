syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "common.proto";

service OrdersService {
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderResponse);
  rpc UpdateStoreOrderStatus(UpdateStoreOrderStatusRequest) returns (UpdateStoreOrderResponse);
  rpc FindOrder (FindOrderRequest) returns (FindOrderResponse);
  rpc FindStoreOrder (FindStoreOrderRequest) returns (FindStoreOrderResponse);
  rpc FindOrders (FindOrdersRequest) returns (FindOrdersResponse);
}

// Request message for UpdateOrderStatus
message UpdateOrderStatusRequest {
  string id = 1;
  string status = 2;
  oneof extra_fields {
    string cancel_reason = 3;
    google.protobuf.Timestamp timestamp = 4;
    int32 delivery_eta = 5;
  }
}
message UpdateOrderResponse {
  Order order = 1;
}

// Request message for UpdateStoreOrderStatus
message UpdateStoreOrderStatusRequest {
  string id = 1;
  string status = 2;
}
message UpdateStoreOrderResponse {
  string id = 1;
  string status = 2;
}

// Request message for FindOrder
message FindOrderRequest {
  oneof filter {
    string id = 1;
    string order_code = 2;
    string status = 3; 
  }
}
message FindOrderResponse {
  Order order = 1;
}


// Request message for FindStoreOrder
message FindStoreOrderRequest {
  oneof filter {
    string id = 1;
    string order_code = 2;
    string order_id = 3;
    string status = 4; 
  }
}
message FindStoreOrderResponse {
  StoreOrder store_order = 1;
}

