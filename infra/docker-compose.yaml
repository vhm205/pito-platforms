version: '3.8'
services:
  postgres:
    image: postgres:17
    container_name: postgres
    
    environment:
      POSTGRES_USER: pito
      POSTGRES_PASSWORD: Hello@2025
      POSTGRES_DB: pitodb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_review.sql:/docker-entrypoint-initdb.d/init_review.sql
    ports:
      - "5432:5432"

  

volumes:
  postgres-data:
